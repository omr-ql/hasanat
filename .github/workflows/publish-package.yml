name: Publish package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download v1.0.0 --repo "${{ github.repository }}" --pattern "hasanat-1.0.0.apk" --dir dist

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cat > dist/hasanat-1.0.0.pom << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.hasanat.app</groupId>
            <artifactId>hasanat</artifactId>
            <version>1.0.0</version>
            <packaging>apk</packaging>
            <name>Hasanat</name>
            <description>Dhikr counter</description>
          </project>
          EOF
          base="https://maven.pkg.github.com/omr-ql/hasanat/com/hasanat/app/hasanat/1.0.0"
          curl --fail-with-body \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --upload-file dist/hasanat-1.0.0.pom \
            "${base}/hasanat-1.0.0.pom"
          curl --fail-with-body \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --upload-file dist/hasanat-1.0.0.apk \
            "${base}/hasanat-1.0.0.apk"
